
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Quản lý Sinh viên</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:Arial,sans-serif;background:#f3f6fa;color:#243247;
  padding:20px
}
.card{
  width:100%;max-width:400px;background:white;padding:32px;
  border:1px solid #e1e7ef;border-radius:10px;
  box-shadow:0 5px 25px #203b6312
}
.logo{text-align:center;color:#203b63;font-size:24px;font-weight:bold}
h1{text-align:center;font-size:22px;margin:20px 0 8px}
p{text-align:center;color:#718096;font-size:14px;margin-bottom:28px}
label{display:block;font-size:14px;font-weight:bold;margin:15px 0 7px}
input{
  width:100%;padding:12px;border:1px solid #cdd7e4;
  border-radius:6px;font-size:15px
}
button{
  width:100%;padding:13px;margin-top:24px;
  background:#2463ad;color:white;border:0;border-radius:6px;
  font-size:15px;cursor:pointer
}
button:disabled{opacity:.6}
.error{color:#ba2931;font-size:13px;margin-top:14px;min-height:18px}
.footer{text-align:center;font-size:12px;color:#78869a;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓 QLSV</div>
  <h1>Đăng nhập hệ thống</h1>
  <p>Dành cho Quản trị viên, Giáo viên và Sinh viên</p>

  <form id="loginForm">
    <label for="username">Tên đăng nhập / Mã sinh viên</label>
    <input id="username" required autocomplete="username"
           placeholder="Ví dụ: admin hoặc SV001">

    <label for="password">Mật khẩu</label>
    <input id="password" type="password" required
           autocomplete="current-password"
           placeholder="Nhập mật khẩu">

    <div class="error" id="error"></div>
    <button id="submitButton" type="submit">Đăng nhập</button>
  </form>

  <div class="footer">Tài khoản được cấp bởi nhà trường</div>
</div>

<script>
document.getElementById('loginForm').onsubmit = async (event) => {
  event.preventDefault();

  const button = document.getElementById('submitButton');
  const error = document.getElementById('error');
  button.disabled = true;
  error.textContent = '';

  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || 'Đăng nhập thất bại');
    }

    const destinations = {
      admin: '/index.html',
      teacher: '/teacher.html',
      student: '/student.html'
    };

    if (!destinations[result.role]) {
      throw new Error('Vai trò tài khoản không hợp lệ');
    }

    window.location.replace(destinations[result.role]);
  } catch (err) {
    error.textContent = err.message;
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
